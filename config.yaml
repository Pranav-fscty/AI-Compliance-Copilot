# Single source of truth for the RAG pipeline.
# Every key can be overridden with an env var RAG_<KEY> (value parsed as YAML), e.g. RAG_TOP_K=5.
# Relative paths are resolved from the repo root, not the current directory.

# --- data ---
raw_dir: data/raw
processed_dir: data/processed
domains: [income_tax, gst, rbi]
# Mis-filed copies of Income-tax Act Ch. I-III (already covered by income_tax_act.md); see CHANGELOG.
exclude_sources: [Circular_No__236302024_GST.md, Circular_No__237312024_GST.md]

# --- chunking ---
chunk_strategy: heading_then_tokens  # split on '## ' headings, then cap each section at chunk_size tokens
chunk_size: 512                      # in tokens of the embedding model's own tokenizer (bge window = 512)
chunk_overlap: 64
min_chunk_chars: 50
chunk_tokenizer: null                # HF tokenizer used to size chunks; null = embedding_model (set it for Ollama embedders)

# --- index ---
embedding_backend: hf    # hf = sentence-transformers in-process (CPU) | ollama = Ollama /api/embed
embedding_model: BAAI/bge-small-en-v1.5
embed_query_prefix: "Represent this sentence for searching relevant passages: "   # bge needs it; nomic: "search_query: "
embed_doc_prefix: ""      # e.g. nomic: "search_document: "
chroma_dir: chroma_db     # embedded mode (local dev)
chroma_host: null         # set (e.g. "chroma") to use a Chroma server instead of chroma_dir
chroma_port: 8000
collection: compliance_bge_small_c512
distance: cosine          # Chroma hnsw:space
hnsw_search_ef: 100       # default 10 made results change between restarts

# --- retrieval ---
top_k: 8
compare_k: 3
reranker: none            # only "none" is implemented

# --- generation ---
llm_model: llama3.1
temperature: 0
llm_think: false          # passed as Ollama think=; must stay off for qwen3* or answers start with a reasoning trace
num_ctx: 8192
debug_endpoints: false    # true adds POST /debug/retrieve and /docs; keep false for black-box testing
ollama_base_url: http://localhost:11434   # NOT OLLAMA_HOST: that var is Ollama's server bind address
prompt_template: |-  # identical to the original STRICT_PROMPT
  You are a legal compliance assistant for Indian law.
  Answer the question using ONLY the context provided below.
  If the answer is not in the context, say "This information is not available in the indexed documents."
  Do NOT use any outside knowledge or training data.

  Context:
  {context}

  Question: {question}

  Answer:
