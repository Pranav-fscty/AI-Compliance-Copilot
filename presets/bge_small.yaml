# bge_small: BAAI/bge-small-en-v1.5 (512-token chunks) + llama3.1 8B, top_k 8.
# Best retrieval in the Phase 3 bench (MRR@10 0.732 vs 0.651 for default).
# Eval status: retrieval only (MLflow run bench_bge-small_c512_retrieval). Answer quality NOT yet measured,
# so this is not the default. Make it the default only after `RAG_PRESET=bge_small python -m eval.run --run-name bge_small`.
embedding_model: BAAI/bge-small-en-v1.5
embed_query_prefix: "Represent this sentence for searching relevant passages: "
chunk_size: 512
chunk_overlap: 64
collection: compliance_bge_small_c512
