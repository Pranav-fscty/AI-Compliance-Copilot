# minilm: the Phase 2 pipeline. all-MiniLM-L6-v2 (256-token chunks) + llama3.1 8B, top_k 8.
# Was the default until the Phase 3 eval; kept for comparison and as a distinct fingerprint for RAG X-Ray.
