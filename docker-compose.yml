services:
  compliance-copilot:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Ollama runs on the Windows host; "localhost" inside the container is the container itself.
      RAG_OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ./chroma_db:/app/chroma_db
      - hf-cache:/root/.cache/huggingface   # embedder download survives rebuilds
    restart: on-failure

volumes:
  hf-cache:
